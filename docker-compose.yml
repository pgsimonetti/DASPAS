services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daspas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - daspas_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/daspas
      JWT_SECRET: cambiar-esta-clave-en-produccion
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - daspas_uploads:/app/uploads
volumes:
  daspas_db:
  daspas_uploads:
